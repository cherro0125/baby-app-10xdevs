services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: babytrack
      POSTGRES_USER: babytrack
      POSTGRES_PASSWORD: babytrack
    ports:
      - "5432:5432"
    volumes:
      - babytrack_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babytrack -d babytrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  babytrack_data:
